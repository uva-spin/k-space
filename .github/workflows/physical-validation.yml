name: full canonical physical validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-validation:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build pinned external PDF resources
        run: python scripts/setup_lhapdf_local.py --work "$RUNNER_TEMP/kt-lhapdf"
      - name: Run all method checks including physical inputs
        run: >-
          python scripts/run_method_validation.py --physical
          --library "$RUNNER_TEMP/kt-lhapdf/runtime/libkt_lhapdf.dylib"
          --pdf-data "$RUNNER_TEMP/kt-lhapdf/runtime/lhapdf/share/LHAPDF"
      - name: Preserve reproduction results and stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-physical-validation
          path: outputs/
          if-no-files-found: warn
