[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-space-verification"
version = "0.2.0"
description = "Reproducible checks for a CSS2 transverse-momentum operator construction"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "sympy==1.14.0", "mpmath==1.3.0"]
license = {text = "MIT"}
authors = [{name = "KCSS pure-kT formalism contributors"}]

[tool.setuptools]
py-modules = ["resummed_operator", "css2_coefficients", "css2_matching", "css2_reference", "lhapdf_provider", "rational_radial", "css2_noncanonical", "dy_measurement", "e866_forward", "native_mixture", "mixture_dnn", "canonical_physical"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
